name: Build Coin Blaster Run

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          mkdir -p project
          unzip -o CoinBlasterRun_GitHub_AutoBuild-1.zip -d project

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find project -name settings.gradle -type f -printf '%h\n' | head -1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK and AAB
        run: |
          cd "$PROJECT_DIR"
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          gradle assembleDebug bundleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoinBlasterRun-APK
          path: '**/build/outputs/apk/**/*.apk'

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: CoinBlasterRun-AAB
          path: '**/build/outputs/bundle/**/*.aab'
